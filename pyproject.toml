[project]
name = "neoinfo"
version = "0.1.0"
description = "A command-line system information tool."
readme = "README.md"
authors = [{ name = "Wensheng Wang", email = "wenshengwang@gmail.com" }]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
neoinfo = "neoinfo:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
